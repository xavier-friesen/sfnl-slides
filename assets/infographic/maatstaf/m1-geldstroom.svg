  <text id="Sluitregel-0" x="30" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="13" fill="#21145F" xml:space="preserve"><tspan x="30" y="300.31"><tspan font-family="Montserrat SemiBold, Montserrat, sans-serif" font-weight="600">Ruim de helft</tspan> gaat naar begeleiding op de werkvloer, want daar wordt het resultaat gehaald.</tspan></text>
  <text id="Bron-0" x="680" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="10" fill="#21145F" fill-opacity="0.7" xml:space="preserve"><tspan x="680" y="297.47">Begroting Social Finance NL, 2026. Prijspeil 2026.</tspan></text>
