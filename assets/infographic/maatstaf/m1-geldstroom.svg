  <text id="Post-4-deel-0" x="690" font-family="Montserrat SemiBold, Montserrat, sans-serif" font-weight="600" font-size="13" fill="#21145F" text-anchor="end" xml:space="preserve"><tspan x="690" y="243.9">8%</tspan></text>
