<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="960pt" height="320pt" viewBox="0 0 960 320">
  <desc>Waar 1,2 miljoen euro werkkapitaal naartoe gaat: vier posten, elk met zijn aandeel, als stroom getekend.</desc>
  <text id="Drager-0" x="30" font-family="Montserrat Light, Montserrat, sans-serif" font-weight="300" font-size="40" fill="#FF7F40" xml:space="preserve"><tspan x="30" y="128.74">€ 1,2 mln</tspan></text>
  <text id="Drager-1" x="30" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="13" fill="#21145F" fill-opacity="0.65" xml:space="preserve"><tspan x="30" y="157.11">werkkapitaal, drie jaar</tspan></text>
  <line id="Aanhef-streep" x1="30" y1="70" x2="220" y2="70" stroke="#FF7F40" stroke-width="2"/>
