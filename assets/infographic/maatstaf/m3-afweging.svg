  <text id="Drager-1" x="30" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="13" fill="#201B5C" fill-opacity="0.65" xml:space="preserve"><tspan x="30" y="313.63">saldo over drie jaar, per cohort van 120</tspan></text>
  <text id="Sluitregel-0" x="330" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="13" fill="#201B5C" xml:space="preserve"><tspan x="330" y="273.31"><tspan font-family="Montserrat SemiBold, Montserrat, sans-serif" font-weight="600">De opbrengst valt bij de gemeente</tspan>, de kosten bij de</tspan><tspan x="330" y="287.87">uitvoerder. Resultaatfinanciering brengt die twee bij elkaar.</tspan></text>
  <text id="Bron-0" x="690" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="10" fill="#201B5C" fill-opacity="0.7" xml:space="preserve"><tspan x="690" y="270.47">Doorrekening SFNL, 2026. Prijspeil 2026.</tspan></text>
