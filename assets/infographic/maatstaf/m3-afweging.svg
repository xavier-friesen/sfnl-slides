<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="960pt" height="320pt" viewBox="0 0 960 320">
  <desc>Drie kostenposten tegenover drie opbrengstposten aan weerszijden van één nullijn, met het saldo als drager.</desc>
