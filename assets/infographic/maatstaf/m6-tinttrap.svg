  <text id="Naam-De-Nieuwe-Kans-0" x="576.31" font-family="Montserrat SemiBold, Montserrat, sans-serif" font-weight="600" font-size="16" fill="#21145F" xml:space="preserve"><tspan x="576.31" y="146.7">De Nieuwe Kans</tspan></text>
