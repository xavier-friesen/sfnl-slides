<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="960pt" height="288.32pt" viewBox="0 0 960 288.32">
  <desc>612 deelnemers over vier uitvoerders; de breedte is het deelnemersaantal, de navytint het plaatsingspercentage</desc>
  <text id="Drager-0" x="40" font-family="Montserrat Light, Montserrat, sans-serif" font-weight="300" font-size="36" fill="#FF7F40" xml:space="preserve"><tspan x="40" y="63.07">15,3 pp</tspan></text>
  <text id="Drager-1" x="40" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="16" fill="#21145F" fill-opacity="0.75" xml:space="preserve"><tspan x="40" y="91.47">verschil in slaagkans tussen de grootste uitvoerder en de kleinste</tspan></text>
  <text id="Drager-2" x="40" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="12" fill="#21145F" fill-opacity="0.6" xml:space="preserve"><tspan x="40" y="115.6">De breedte is het aantal deelnemers, de tint het plaatsingspercentage.</tspan></text>
  <text id="Sluitregel-0" x="540" font-family="Lato Light, Lato, sans-serif" font-weight="300" font-size="16" fill="#21145F" fill-opacity="0.85" xml:space="preserve"><tspan x="540" y="59.15"><tspan font-family="Montserrat SemiBold, Montserrat, sans-serif" font-weight="600">Aan de Slag</tspan> is de grootste uitvoerder en de enige</tspan><tspan x="540" y="77.07">die de doelstelling van 45% bijna haalt.</tspan></text>
  <text id="Naam-Aan-de-Slag-0" x="40" font-family="Montserrat SemiBold, Montserrat, sans-serif" font-weight="600" font-size="16" fill="#21145F" xml:space="preserve"><tspan x="40" y="146.7">Aan de Slag</tspan></text>
